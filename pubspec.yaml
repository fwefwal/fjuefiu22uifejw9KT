name: mvvm_elementary
description: A Flutter app using Clean Architecture and MVVM with Elementary package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  elementary: ^3.2.1
  elementary_helper: ^1.1.0
  provider: ^6.1.2
  uuid: ^4.4.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  elementary_test: ^2.0.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
